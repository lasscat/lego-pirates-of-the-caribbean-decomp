# Per-game build settings read by tools/configure.py (shared by every game). Delete a key to get the default.
game = "lego_pirates_of_the_caribbean"
mwcc_version = "dsi/1.1"     # Identified via byte-exact probes (docs/compiler.md); single files can differ in config/<version>/compilers.txt
opt = "-O4,p"
lang = "c"                   # "c" for SDK .c files; .cpp game/engine files use -lang=c++ per tools/configure.py
extra_cc_flags = []
